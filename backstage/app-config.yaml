app:
  title: Wenia Platform
  # Puerto propio del reto (no 3000): ese lo usa otro Backstage local.
  baseUrl: http://localhost:3100

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # El Home de Wenia es la pagina principal; el catalogo queda en /catalog.
    - page:home:
        config:
          path: /
          defaultConfig:
            - component: WeniaHero
              column: 0
              row: 0
              width: 12
              height: 6
            - component: WeniaFlow
              column: 0
              row: 6
              width: 12
              height: 3
            - component: WeniaMetrics
              column: 0
              row: 9
              width: 7
              height: 5
            - component: WeniaPlatform
              column: 0
              row: 14
              width: 7
              height: 4
            - component: WeniaObservability
              column: 7
              row: 9
              width: 5
              height: 5
            - component: WeniaStatus
              column: 7
              row: 14
              width: 5
              height: 4
    # El grafo arranca mostrando los tipos que usa la plataforma.
    - page:catalog-graph:
        config:
          selectedKinds: [System, Component, Resource, API, Group]
    # Un solo tema (Wenia Dark): se desactiva el claro por defecto.
    - theme:app/light: false

organization:
  name: Wenia Platform

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7100
  listen:
    port: 7100
    # Uncomment the following host directive to bind to specific interfaces
    # 7100 es el puerto propio del reto (el 7007 estandar puede estar ocupado) y 127.0.0.1 evita
    # escuchar en la red local.
    host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    # El origin debe coincidir con el puerto web (app.baseUrl), o el navegador bloquea las
    # llamadas al backend. Puertos definidos en: .env.local.example.
    origin: http://localhost:3100
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  # Postgres en vez de memoria, para que el catalogo sobreviva a un reinicio. Las credenciales salen
  # del entorno (direnv carga .env.local). El contenedor se define en: docker-compose.yml.
  database:
    client: pg
    connection:
      host: localhost
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  endpoints:
    # Estado publico de terceros (solo lectura). Las llamadas exigen un usuario con sesion.
    '/github-status':
      target: https://www.githubstatus.com/api/v2
      changeOrigin: true
      allowedMethods: ['GET']
    '/newrelic-status':
      target: https://status.newrelic.com/api/v2
      changeOrigin: true
      allowedMethods: ['GET']
    '/aws-health':
      target: https://health.aws.amazon.com/public
      changeOrigin: true
      allowedMethods: ['GET']
      headers:
        Accept-Encoding: identity
    # Solo lectura (GET): el token vive en el servidor y nunca llega al navegador.
    # Lo usa el boton "Validar catalogo" para comprobar que cada repo todavia existe.
    '/github-api':
      target: https://api.github.com
      changeOrigin: true
      allowedMethods: ['GET']
      headers:
        Authorization: Bearer ${GITHUB_TOKEN}

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  environment: development
  providers:
    guest: {}
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # El login de GitHub debe coincidir con metadata.name de un User del catalogo
            - resolver: usernameMatchingUserEntityName
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  # Template va en la regla global porque la regla por ubicacion no bastaba (el catalogo rechazaba
  # la plantilla al refrescarla).
  rules:
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    # Las rutas file: son relativas a packages/backend. ../../../ llega a la raiz de wenia-platform
    # y ../../../../ a Repos/, donde vive el repo hermano backstage-templates (plantillas y skeleton).
    # Se quitaron los ejemplos de Backstage para que /create muestre solo nuestra plantilla.
    # Equipos (Group): catalog/org.yaml.
    - type: file
      target: ../../../catalog/org.yaml
      rules:
        - allow: [User, Group]

    # La plataforma como sistema (Catalog Graph) y su documentacion (Docs).
    - type: file
      target: ../../../catalog/platform.yaml
      rules:
        - allow: [System, Component, Resource]

    # Una card por plantilla: cada archivo templates/<nombre>/template.yaml del repo hermano.
    # Las plantillas nuevas aparecen solas al agregar su archivo (sin tocar esta config).
    - type: file
      target: ../../../../backstage-templates/templates/*/template.yaml
      rules:
        - allow: [Template]

    # Equipos creados con la plantilla team-registration (un archivo por equipo).
    - type: file
      target: ../../../catalog/teams/*.yaml
      rules:
        - allow: [Group]


    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'My Company Backstage' # defaults to "backstage"
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal' # optional
