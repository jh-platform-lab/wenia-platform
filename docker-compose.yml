# Backstage + Postgres en local.
# Desarrollo: solo `docker compose up -d postgres` y `yarn start` (desde backstage/), recompila en segundos.
# Todo en contenedores (simula EKS): `docker compose --profile app up -d`. La imagen sale de
# `bash scripts/build-backstage-image.sh` o de GHCR (BACKSTAGE_IMAGE). Web y API en 3100.
#
# PUERTOS PROPIOS del reto (no los estandar), para no chocar con otro Backstage local:
#   web 3100  |  backend 7100  |  postgres 5442
#
#
# Las credenciales vienen del entorno (direnv carga .env.local), no estan en este archivo.
# Plantilla: .env.local.example

name: wenia-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: wenia-backstage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.local}
      POSTGRES_DB: backstage
    ports:
      # Solo loopback: la base no se expone a la red local.
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - wenia-backstage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backstage} -d backstage"]
      interval: 5s
      timeout: 3s
      retries: 10

  backstage:
    profiles: [app]
    image: ${BACKSTAGE_IMAGE:-wenia/backstage:local}
    container_name: wenia-backstage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "packages/backend", "--config", "app-config.yaml", "--config", "app-config.k8s.yaml"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.local}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?define GITHUB_TOKEN en .env.local}
    ports:
      - "127.0.0.1:${BACKSTAGE_WEB_PORT:-3100}:7007"

volumes:
  wenia-backstage-pgdata:
