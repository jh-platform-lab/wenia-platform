# Backstage + Postgres en local.
# Desarrollo: solo `docker compose up -d postgres` y `yarn start` (desde backstage/), recompila en segundos.
# Todo en contenedores (simula EKS): `docker compose --profile app up -d`. Por defecto baja la ultima
# imagen que publica el CI en GHCR. Para probar una rama sin esperar al CI:
#   bash scripts/build-backstage-image.sh y BACKSTAGE_IMAGE=wenia/backstage:local BACKSTAGE_PULL=never
# Web y API en 3100.
#
# PUERTOS PROPIOS del reto (no los estandar), para no chocar con otro Backstage local:
#   web 3100  |  backend 7100  |  postgres 5442
#
#
# Las credenciales vienen del entorno (direnv carga .env.local), no estan en este archivo.
# Plantilla: .env.local.example

name: wenia-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: wenia-backstage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.local}
      POSTGRES_DB: backstage
    ports:
      # Solo loopback: la base no se expone a la red local.
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - wenia-backstage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backstage} -d backstage"]
      interval: 5s
      timeout: 3s
      retries: 10

  backstage:
    profiles: [app]
    image: ${BACKSTAGE_IMAGE:-ghcr.io/jh-platform-lab/backstage:latest}
    # always: cada `up` revisa GHCR y baja la imagen nueva. Con una imagen local usa never.
    pull_policy: ${BACKSTAGE_PULL:-always}
    container_name: wenia-backstage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "packages/backend", "--config", "app-config.yaml", "--config", "app-config.k8s.yaml"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.local}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?define GITHUB_TOKEN en .env.local}
    ports:
      - "127.0.0.1:${BACKSTAGE_WEB_PORT:-3100}:7007"
    labels:
      # Solo este contenedor lo actualiza Watchtower (ver el servicio watchtower).
      com.centurylinklabs.watchtower.enable: "true"

  # Despliegue automatico en local: cada WATCHTOWER_POLL_INTERVAL segundos revisa GHCR y, si el CI
  # publico una imagen nueva de Backstage, la baja y recrea el contenedor. Es opcional:
  #   docker compose --profile app --profile autodeploy up -d
  # Monta el socket de Docker (controla los contenedores de esta maquina): solo para uso local,
  # y con --label-enable solo toca los servicios marcados arriba. En un cluster lo hace ArgoCD.
  watchtower:
    profiles: [autodeploy]
    image: ghcr.io/nicholas-fedor/watchtower:1.23.2
    container_name: wenia-watchtower
    restart: unless-stopped
    command: ["--label-enable", "--cleanup", "--interval", "60"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  wenia-backstage-pgdata:
