# Configuracion del agente APM de New Relic (servicio sobre Kubernetes).
# Todo valor puede sobreescribirse con variables NEW_RELIC_* (por ejemplo en el Deployment).
# La licencia NO va aqui: se inyecta como NEW_RELIC_LICENSE_KEY desde un Secret.
[newrelic]
app_name = onboarding-api
monitor_mode = true
log_file = stdout
log_level = info

distributed_tracing.enabled = true
application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.metrics.enabled = true
